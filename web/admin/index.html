<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OurNotes · 管理后台</title><link rel="stylesheet" href="/admin/assets/style.css"><script src="/admin/assets/app.js" defer></script></head>
<body>
<header><a class="brand" href="/">OurNotes</a><span id="identity" class="muted"></span><button id="logout" type="button" hidden>退出登录</button></header>
<main>
  <section id="login-panel" class="login panel"><h1>管理后台</h1><form id="login-form"><label>用户名<input name="username" autocomplete="username" required maxlength="80"></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><button type="submit">登录</button></form></section>
  <div id="workspace" hidden>
    <nav id="tabs" class="admin-nav" aria-label="管理导航"><a href="#accounts">账号</a><a href="#statistics">统计</a><a href="#presets">共享预设</a><a href="#activities">活动</a><a href="#announcement">公告</a><a href="#connection">接入凭据</a><a id="admins-tab" href="#administrators" hidden>管理员</a></nav>
    <section class="panel view" data-view="accounts"><div class="heading"><div><h1>账号管理</h1></div><button id="accounts-refresh" class="secondary" type="button">刷新</button></div><form id="accounts-form" class="toolbar"><label>编号<input id="account-index" inputmode="numeric" pattern="[0-9]*" placeholder="全部账号" autocomplete="off"></label><label>上传用户<select id="owner"><option value="">全部用户</option></select></label><label>使用预设<select id="account-preset"><option value="">全部预设</option></select></label><button id="accounts-submit" type="submit">查询</button></form><p id="account-count" class="muted"></p><p id="accounts-loading" class="muted small" role="status" aria-live="polite"></p><div id="account-list" class="account-list"></div><div class="pagination"><button id="previous" type="button" class="secondary" disabled>上一页</button><span id="page"></span><button id="next" type="button" class="secondary" disabled>下一页</button></div><div id="account-detail" hidden></div></section>
    <section class="view statistics" data-view="statistics" hidden><div class="toolbar"><div><h1>SSR 统计</h1><p id="sample" class="muted"></p></div><div class="actions"><label>统计范围<select id="scope"><option value="all">全部账号</option><option value="used">已使用账号</option></select></label><label>上传用户<select id="statistics-owner"><option value="">全部用户</option></select></label><button id="refresh" type="button" class="secondary">刷新</button></div></div><div id="tables" class="tables"></div><p id="observed" class="muted small"></p></section>
    <section class="panel view" data-view="presets" hidden><div class="heading"><div><h1>抽卡预设</h1></div><button id="preset-new" type="button" disabled>新增预设</button></div><label>选择预设<select id="preset-select"></select></label><form id="preset-form"><fieldset id="preset-fields"><label>名称<input id="preset-name" required maxlength="80"></label><label>说明<input id="preset-description" maxlength="500"></label><div id="preset-entries" class="preset-entries"></div><button id="preset-add-entry" type="button" class="secondary">增加抽卡项目</button><div class="actions"><button type="submit">保存预设</button><button id="preset-delete" type="button" class="danger" disabled>删除预设</button></div></fieldset></form><p id="preset-status" role="status"></p></section>
    <section class="panel view" data-view="activities" hidden><h1>活动卡池</h1><form id="activity-form"><label>当前活动<select id="activity-select"></select></label><button type="submit">保存活动</button></form><p id="activity-status" role="status"></p><div id="activity-detail" class="muted"></div></section>
    <section class="panel view" data-view="announcement" hidden><h1>网站公告</h1><form id="announcement-form"><label>公告内容<textarea id="announcement-content" rows="6" maxlength="5000"></textarea></label><button type="submit">保存公告</button></form><p id="announcement-status" role="status"></p></section>
    <section class="panel view" data-view="connection" hidden><h1>连接桌面客户端</h1><div class="actions"><button id="credential-show" type="button">查看凭据</button><button id="credential-copy" type="button" class="secondary" hidden>复制凭据</button><button id="credential-reset" type="button" class="danger">重置凭据</button></div><pre id="credential" hidden></pre><p id="credential-status" role="status"></p><h2>Gmail 状态</h2><p id="gmail-health" class="muted"></p></section>
    <section class="panel view" data-view="administrators" hidden><h1>管理员</h1><div id="administrator-list"></div><h2>新增管理员</h2><form id="administrator-form"><label>用户名<input name="username" required pattern="[A-Za-z][A-Za-z0-9_-]{0,79}" maxlength="80" autocomplete="off"></label><label>初始密码<input name="password" type="password" required minlength="8" maxlength="256" autocomplete="new-password"></label><button type="submit">新增管理员</button></form></section>
  </div>
  <p id="notice" role="alert" hidden></p>
</main>
</body></html>
